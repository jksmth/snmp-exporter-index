name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.0"
          cache: false

      - name: Test the source, the generated patch, and the example module
        run: make test

      - name: Walk a simulated switch and fetch one interface
        run: make bench-check

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate the patch from the Go sources
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.31.0' }}
        run: make patch

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Tags
        id: tags
        run: |
          image="${{ steps.image.outputs.name }}"
          {
            echo "list<<EOF"
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "${image}:${{ github.ref_name }}"
              echo "${image}:latest"
            else
              echo "${image}:sha-${GITHUB_SHA::12}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build date
        id: built
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: true
          sbom: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            SNMP_EXPORTER_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'v0.31.0' }}
            BUILD_DATE=${{ steps.built.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach the patch to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          asset="dist/snmp_exporter-${tag}-index.patch"
          notes=$(cat <<EOF
          snmp_exporter ${tag} with an optional \`index\` query parameter.

          Image: \`ghcr.io/${{ github.repository }}:${tag}\` and \`:latest\` (\`linux/amd64\`).

          Apply the asset to a clean [prometheus/snmp_exporter](https://github.com/prometheus/snmp_exporter) ${tag} tree:

          \`\`\`sh
          patch -p1 < snmp_exporter-${tag}-index.patch
          \`\`\`
          EOF
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "$asset" --title "$tag" --notes "$notes"
          fi
