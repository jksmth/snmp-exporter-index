name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the release platform list
        run: python3 scripts/release.py matrix

      - name: Clone upstream and apply the patch
        run: make patch

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .cache/snmp_exporter/go.mod
          cache: false

      - name: Test the source, the generated patch, and the example module
        run: make test

      - name: Walk a simulated switch and fetch one interface
        run: make bench-check
