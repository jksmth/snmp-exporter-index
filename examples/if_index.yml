# Columns for one interface, indexed by ifIndex.
#
# A scrape without "index" walks these columns for every interface.
# A scrape with index=42 fetches each column for ifIndex 42 with SNMP GET.
# index=1,3,10-20 fetches those rows. A range is inclusive and at most 256 suffixes.
#
# Load it next to the generated config:
#   --config.file=/etc/snmp_exporter/snmp.yml --config.file=/etc/snmp_exporter/if_index.yml
modules:
  if_index:
    walk:
      - 1.3.6.1.2.1.2.2.1.2       # ifDescr
      - 1.3.6.1.2.1.2.2.1.5       # ifSpeed
      - 1.3.6.1.2.1.2.2.1.7       # ifAdminStatus
      - 1.3.6.1.2.1.2.2.1.8       # ifOperStatus
      - 1.3.6.1.2.1.2.2.1.10      # ifInOctets
      - 1.3.6.1.2.1.31.1.1.1.1    # ifName
      - 1.3.6.1.2.1.31.1.1.1.6    # ifHCInOctets
      - 1.3.6.1.2.1.31.1.1.1.10   # ifHCOutOctets
      - 1.3.6.1.2.1.31.1.1.1.15   # ifHighSpeed
      - 1.3.6.1.2.1.31.1.1.1.18   # ifAlias
      # dot3StatsDuplexStatus, indexed by ifIndex. A longer suffix under this
      # column is not that row. The exporter skips it instead of labeling
      # every object with the first sub-identifier.
      - 1.3.6.1.2.1.10.7.2.1.19
    metrics:
      - name: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
        help: A textual string containing information about the interface. 1.3.6.1.2.1.2.2.1.2
        indexes: &if_index
          - labelname: ifIndex
            type: gauge
        lookups: &if_lookups
          - labels: [ifIndex]
            labelname: ifAlias
            oid: 1.3.6.1.2.1.31.1.1.1.18
            type: DisplayString
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
          - labels: [ifIndex]
            labelname: ifName
            oid: 1.3.6.1.2.1.31.1.1.1.1
            type: DisplayString

      - name: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString
        help: The textual name of the interface. 1.3.6.1.2.1.31.1.1.1.1
        indexes: *if_index
        lookups: *if_lookups

      - name: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
        help: This object is an 'alias' name for the interface as specified by a network manager. 1.3.6.1.2.1.31.1.1.1.18
        indexes: *if_index
        lookups: *if_lookups

      - name: ifSpeed
        oid: 1.3.6.1.2.1.2.2.1.5
        type: gauge
        help: An estimate of the interface's current bandwidth in bits per second. 1.3.6.1.2.1.2.2.1.5
        indexes: *if_index
        lookups: *if_lookups

      - name: ifHighSpeed
        oid: 1.3.6.1.2.1.31.1.1.1.15
        type: gauge
        help: An estimate of the interface's current bandwidth in units of 1,000,000 bits per second. 1.3.6.1.2.1.31.1.1.1.15
        indexes: *if_index
        lookups: *if_lookups

      - name: ifAdminStatus
        oid: 1.3.6.1.2.1.2.2.1.7
        type: gauge
        help: The desired state of the interface. 1.3.6.1.2.1.2.2.1.7
        indexes: *if_index
        lookups: *if_lookups
        enum_values:
          1: up
          2: down
          3: testing

      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: The current operational state of the interface. 1.3.6.1.2.1.2.2.1.8
        indexes: *if_index
        lookups: *if_lookups
        enum_values:
          1: up
          2: down
          3: testing
          4: unknown
          5: dormant
          6: notPresent
          7: lowerLayerDown

      - name: ifInOctets
        oid: 1.3.6.1.2.1.2.2.1.10
        type: counter
        help: The total number of octets received on the interface, including framing characters. 1.3.6.1.2.1.2.2.1.10
        indexes: *if_index
        lookups: *if_lookups

      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        help: The total number of octets received on the interface, including framing characters. 1.3.6.1.2.1.31.1.1.1.6
        indexes: *if_index
        lookups: *if_lookups

      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        help: The total number of octets transmitted out of the interface, including framing characters. 1.3.6.1.2.1.31.1.1.1.10
        indexes: *if_index
        lookups: *if_lookups

      - name: dot3StatsDuplexStatus
        oid: 1.3.6.1.2.1.10.7.2.1.19
        type: gauge
        help: The current duplex mode of the MAC entity. 1 unknown, 2 halfDuplex, 3 fullDuplex. 1.3.6.1.2.1.10.7.2.1.19
        indexes: *if_index
        lookups: *if_lookups
        enum_values:
          1: unknown
          2: halfDuplex
          3: fullDuplex
